let coins=[],cc=0,AC;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
function sip(){try{ac();const n=Math.floor(AC.sampleRate*.4),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++){const k=i/n;d[i]=(Math.random()*2-1)*Math.sin(Math.PI*Math.pow(k,.5))*(.65+.35*Math.sin(k*70))}
const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=5;const T=AC.currentTime;f.frequency.setValueAtTime(700,T);f.frequency.exponentialRampToValueAtTime(3200,T+.38);const g=AC.createGain();g.gain.value=1.4;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}}

const $=id=>document.getElementById(id);$('hi').textContent='🏆 '+hi;
const snd=new Audio(SND);snd.preload='auto';
function spawn(){const fl=[0,1,2][Math.floor(Math.random()*3)];for(let i=0;i<5;i++){const c=chai();c.position.set(LX[fl],.9,-90-i*2.5);S.add(c);coins.push(c)}

snd.volume=0;snd.play().then(()=>{snd.pause();snd.currentTime=0;snd.volume=1}).catch(()=>{snd.volume=1})}

$('t').textContent='GAME OVER';$('m').textContent='Score: '+d+' m';$('s').textContent='☕ Chai: '+cc+'  |  Top speed: '+(speed/14).toFixed(1)+'x';$('b').textContent='RESTART';
